    role: Project Scientist · IIT Delhi
    pi: "PI: Prof. Brejesh Lall · Co-PI: Dr. Dhiman Saha"
    description: Mitigating authentication relay attacks by false base stations in 5G and beyond.
    tags: [5G, Standards]

